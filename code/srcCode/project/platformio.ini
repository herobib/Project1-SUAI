[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

# Указываем реальные объемы памяти
board_upload.flash_size = 8MB

# Использовать схему разделов, поддерживающую разметку под приложение и файловую систему
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs

lib_deps =
    esphome/ESPAsyncWebServer-esphome@^3.2.0
	Links2004/WebSockets@^2.4.1
	bblanchon/ArduinoJson @ ^7.0.0
	esp-arduino-libs/ESP32_USB_STREAM@^0.1.0

board_build.arduino.memory_type = qio_opi 

# --- ЖЕСТКАЯ АКТИВАЦИЯ 8MB OPI PSRAM ДЛЯ КЛАССА N8R8 ---
build_flags = 
    -D CORE_DEBUG_LEVEL=1
    -Os
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -D CONFIG_SPIRAM_MODE_OCT=1            # Включаем 8-битную Octal шину для R8 памяти
    -D CONFIG_SPIRAM_SPEED_80M=1           # Задаем стабильную частоту работы RAM
    -D ARDUINO_USB_CDC_ON_BOOT=0           # Настройка для стабильной работы Native порта
monitor_speed=115200